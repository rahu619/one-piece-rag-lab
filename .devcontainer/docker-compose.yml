services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - QDRANT_HOST=qdrant
      # Environment variables required for the application
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__ModelId=qwen2.5-coder:1.5b
      - Ollama__EmbeddingModelId=nomic-embed-text
      - Ingestion__RunOnStart=true
      # Relative paths resolve against the build output directory, and Linux is case-sensitive.
      - Ingestion__CsvFilePath=Data/one_piece_episodes.csv
    depends_on:
      - qdrant
      - ollama

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh # Mount the script
    entrypoint: [ "/usr/bin/bash", "/entrypoint.sh" ] # Override entrypoint

volumes:
  qdrant_data:
  ollama_data:
