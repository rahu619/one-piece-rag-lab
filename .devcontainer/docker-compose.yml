services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: